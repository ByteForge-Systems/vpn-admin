{% load static %}
<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Untitled</title>
    <link rel="stylesheet" href="{% static 'assets/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&display=swap">
    <link rel="stylesheet" href="{% static 'assets/fonts/fontawesome-all.min.css' %}">
</head>

<body class="d-xl-flex align-items-xl-start">
    <nav class="navbar align-items-start sidebar sidebar-dark accordion bg-gradient-primary p-0 navbar-dark">
        <div class="container-fluid d-flex flex-column p-0"><a class="navbar-brand d-flex justify-content-center align-items-center sidebar-brand m-0" href="#">
                <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-laugh-wink"></i></div>
                <div class="sidebar-brand-text mx-3"><span>GOIDA</span></div>
            </a>
            <hr class="sidebar-divider my-0">
            <ul class="navbar-nav text-light" id="accordionSidebar">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}" href="{% url 'dashboard' %}">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/servers/' %}active{% endif %}" href="{% url 'servers' %}">
                            <i class="fas fa-server"></i>
                            <span>Servers</span>
                        </a>
                    </li>
                </ul>
            <div class="text-center d-none d-md-inline"><button class="btn rounded-circle border-0" id="sidebarToggle" type="button"></button></div>
        </div>
    </nav>
    <div class="row flex-fill">
        {% for node in nodes %}
        <div class="col-md-2 mb-4">
            <div class="card">
                <div class="card-body text-center">
                    <h4 class="card-title">Node {{ node.id }}</h4>
                    <h6 class="text-muted card-subtitle mb-2">
                        Status:
                        <span class="badge {% if node.is_online %}bg-success{% else %}bg-danger{% endif %}">
                                {% if node.is_online %}On{% else %}Off{% endif %}
                        </span>
                    </h6>
                    <p class="card-text">
                        <strong>IP:</strong> {{ node.ip }}<br>
                        <strong>ID:</strong> {{ node.id }}<br>
                        <strong>Country:</strong> {{ node.country }}<br>
                        <strong>Port:</strong> {{ node.port }}<br>
                    </p>
                    <button class="btn btn-primary deploy-btn" data-node-ip="{{ node.ip }}">Deploy</button>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-warning">No nodes available.</div>
        </div>
        {% endfor %}
    </div>
    <script src="{% static 'assets/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'assets/js/chart.min.js' %}"></script>
    <script src="{% static 'assets/js/bs-init.js' %}"></script>
    <script src="{% static 'assets/js/theme.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const deployButtons = document.querySelectorAll('.deploy-btn');
            deployButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const nodeIp = this.getAttribute('data-node-ip');
                    const csrftoken = getCookie('csrftoken');

                    button.disabled = true;
                    button.innerHTML = 'Deploying...';

                    fetch('{% url "deploy" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        },
                        body: JSON.stringify({ node_ip: nodeIp })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            alert('Deployment successful: ' + data.message);
                        } else {
                            alert('Deployment failed: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred during deployment.');
                    })
                    .finally(() => {
                        // Восстанавливаем кнопку
                        button.disabled = false;
                        button.innerHTML = 'Deploy';
                    });
                });
            });

            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
        });
    </script>
</body>

</html>
